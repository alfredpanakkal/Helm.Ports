  <body>
    <script>
      // Pre-hydration theme: apply the saved/system theme before first paint
      // so the page never flashes light-then-dark on mobile. Mirrors the
      // ThemeProvider logic in src/components/theme-provider.tsx.
      try {
        var t = localStorage.getItem("helm-ports-theme") || "system";
        var dark =
          t === "dark" ||
          (t !== "light" &&
            window.matchMedia("(prefers-color-scheme: dark)").matches);
        if (dark) document.documentElement.classList.add("dark");
      } catch (e) {}
    </script>

    <script type="module" src="/src/main.tsx"></script>
